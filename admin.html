<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Admin — QuickPay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { touch-action: pan-y; -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: radial-gradient(circle at 20% 0%, #1e293b 0%, #0f172a 60%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; color: #0f172a;
    -webkit-font-smoothing: antialiased;
  }
  .admin-card {
    background: rgba(255,255,255,0.98);
    backdrop-filter: blur(20px);
    border-radius: 24px; width: 100%; max-width: 430px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.1);
    animation: cardIn 0.5s cubic-bezier(0.16,1,0.3,1);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .admin-header {
    background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
    padding: 28px 28px 26px; color: #fff;
    position: relative; overflow: hidden;
  }
  .admin-header::after {
    content: ''; position: absolute; top: -50%; right: -30%;
    width: 200px; height: 200px; border-radius: 50%;
    background: radial-gradient(circle, rgba(124,58,237,0.3), transparent 70%);
  }
  .admin-header h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px; font-weight: 700; letter-spacing: -0.5px;
    display: flex; align-items: center; gap: 10px; position: relative;
  }
  .admin-header h2 svg { width: 22px; height: 22px; stroke: #a78bfa; }
  .admin-header p { font-size: 13px; color: #9ca3af; margin-top: 6px; position: relative; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(124,58,237,0.15); border: 1px solid rgba(124,58,237,0.3);
    color: #a78bfa; font-size: 11px; font-weight: 600;
    padding: 4px 10px; border-radius: 100px; margin-top: 14px;
    position: relative;
  }
  .badge::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: #a78bfa; animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }
  .admin-body { padding: 28px; }
  .field-label {
    font-size: 12px; font-weight: 600; color: #64748b;
    text-transform: uppercase; letter-spacing: 0.8px;
    margin-bottom: 10px; display: block;
  }
  .input-wrap { position: relative; margin-bottom: 18px; }
  .input-wrap .rupee {
    position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
    font-size: 22px; color: #94a3b8; font-weight: 700;
    font-family: 'Space Grotesk', sans-serif;
  }
  input[type="number"] {
    width: 100%; padding: 18px 18px 18px 46px;
    font-size: 22px; font-weight: 700;
    font-family: 'Space Grotesk', sans-serif;
    border: 2px solid #e2e8f0; border-radius: 16px;
    outline: none; transition: all 0.25s cubic-bezier(0.16,1,0.3,1);
    color: #0f172a; background: #f8fafc;
  }
  input[type="number"]:focus {
    border-color: #7c3aed; background: #fff;
    box-shadow: 0 0 0 5px rgba(124,58,237,0.12);
    transform: translateY(-1px);
  }
  input[type="number"]::placeholder { color: #cbd5e1; font-weight: 600; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .btn {
    width: 100%; padding: 17px; border: none; border-radius: 16px;
    font-size: 15px; font-weight: 700; cursor: pointer;
    transition: all 0.2s cubic-bezier(0.16,1,0.3,1);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-family: 'Inter', sans-serif; letter-spacing: 0.2px;
  }
  .btn svg { width: 18px; height: 18px; }
  .btn-primary {
    background: linear-gradient(135deg, #7c3aed 0%, #5f259f 100%);
    color: #fff;
    box-shadow: 0 12px 28px rgba(124,58,237,0.4);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 16px 36px rgba(124,58,237,0.5); }
  .btn-primary:active { transform: translateY(0) scale(0.98); }
  .btn-copy {
    background: #ecfdf5; color: #059669;
    border: 2px solid #a7f3d0; margin-top: 10px;
  }
  .btn-copy:hover { background: #d1fae5; transform: translateY(-1px); }
  .btn-wa {
    background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
    color: #fff; margin-top: 10px;
    box-shadow: 0 12px 28px rgba(37,211,102,0.35);
  }
  .btn-wa:hover { transform: translateY(-2px); box-shadow: 0 16px 36px rgba(37,211,102,0.45); }
  .result-box {
    display: none; margin-top: 22px; padding: 18px;
    background: #f8fafc; border: 1px solid #e2e8f0;
    border-radius: 16px;
    animation: slideUp 0.4s cubic-bezier(0.16,1,0.3,1);
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .result-box .lbl {
    font-size: 11px; color: #64748b; text-transform: uppercase;
    letter-spacing: 0.8px; margin-bottom: 8px; font-weight: 600;
  }
  .result-box .link-text {
    font-size: 12px; color: #0f172a; word-break: break-all;
    background: #fff; padding: 12px; border-radius: 10px;
    border: 1px solid #e2e8f0; font-family: 'Space Grotesk', monospace;
    font-weight: 500; line-height: 1.5;
  }
  .toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #111827; color: #fff; padding: 14px 24px;
    border-radius: 14px; font-size: 13px; font-weight: 600;
    opacity: 0; transition: all 0.35s cubic-bezier(0.16,1,0.3,1);
    z-index: 999; box-shadow: 0 16px 40px rgba(0,0,0,0.3);
    display: flex; align-items: center; gap: 8px;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast svg { width: 16px; height: 16px; color: #25D366; }
</style>
</head>
<body>
<div class="admin-card">
  <div class="admin-header">
    <h2>
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Admin Panel
    </h2>
    <p>Enter amount and get customer link</p>
    <div class="badge">Secure Access</div>
  </div>
  <div class="admin-body">
    <label class="field-label">Amount / राशि</label>
    <div class="input-wrap">
      <span class="rupee">₹</span>
      <input type="number" id="adminAmount" placeholder="Amount" min="1" inputmode="numeric">
    </div>
    <button class="btn btn-primary" onclick="generateLink()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      Generate Link
    </button>

    <div class="result-box" id="resultBox">
      <div class="lbl">Customer Link / ग्राहक लिंक</div>
      <div class="link-text" id="linkText"></div>
      <button class="btn btn-copy" onclick="copyLink()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy Link
      </button>
      <button class="btn btn-wa" onclick="shareWhatsApp()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
        Share on WhatsApp
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  <span id="toastMsg">Copied!</span>
</div>

<script>
let currentLink = "";
let currentAmount = 0;

function showToast(msg) {
  document.getElementById('toastMsg').textContent = msg;
  document.getElementById('toast').classList.add('show');
  setTimeout(() => document.getElementById('toast').classList.remove('show'), 2000);
}

function generateLink() {
  const amt = document.getElementById('adminAmount').value;
  if (!amt || amt <= 0) { alert('Please enter a valid amount'); return; }
  currentAmount = amt;
  const base = window.location.origin + window.location.pathname.replace('admin.html', 'index.html');
  currentLink = `${base}?am=${amt}`;
  document.getElementById('linkText').textContent = currentLink;
  document.getElementById('resultBox').style.display = 'block';
}

function copyLink() {
  if (!currentLink) return;
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(currentLink)
      .then(() => showToast('Link copied!'))
      .catch(() => fallbackCopy(currentLink));
  } else fallbackCopy(currentLink);
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); showToast('Link copied!'); }
  catch(e) { showToast('Copy failed'); }
  document.body.removeChild(ta);
}

function shareWhatsApp() {
  if (!currentLink) return;
  const msg = `नमस्ते! 🙏\n\nकृपया *₹${currentAmount}* का भुगतान करें।\n\n👇 नीचे लिंक पर क्लिक करें:\n${currentLink}\n\nधन्यवाद! ✨`;
  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
}
</script>
</body>
</html>
