<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QuickPay</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { touch-action: pan-y; -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    background: #fff; border-radius: 20px; width: 100%; max-width: 420px;
    overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .header { background: #1e293b; padding: 30px 28px 26px; text-align: center; color: #fff; }
  .header .brand { font-size: 11px; letter-spacing: 2px; color: #94a3b8; margin-bottom: 14px; }
  .header .amount { font-size: 48px; font-weight: 800; letter-spacing: -2px; line-height: 1; }
  .header .amount span { font-size: 26px; font-weight: 600; color: #cbd5e1; vertical-align: top; }
  .header .desc { font-size: 13px; color: #94a3b8; margin-top: 8px; }
  .body { padding: 26px; }
  .info-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 13px 0; border-bottom: 1px solid #f1f5f9; font-size: 14px;
  }
  .info-row .label { color: #64748b; }
  .info-row .value { font-weight: 600; color: #0f172a; }
  .pay-title { font-size: 13px; font-weight: 700; color: #374151; margin: 22px 0 12px; text-align: center; }
  .app-list { display: flex; flex-direction: column; gap: 10px; }
  .app-item {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px;
    border: 2px solid #e5e7eb; border-radius: 14px; text-decoration: none;
    color: #0f172a; transition: all 0.15s; cursor: pointer;
  }
  .app-item:active { transform: scale(0.98); border-color: #5f259f; background: #f9f7ff; }
  .app-icon {
    width: 42px; height: 42px; border-radius: 12px; display: flex;
    align-items: center; justify-content: center; font-size: 20px; font-weight: 800; color: #fff;
  }
  .icon-phonepe { background: #5f259f; }
  .icon-paytm { background: #00baf2; }
  .icon-gpay { background: #1a73e8; }
  .app-info { flex: 1; }
  .app-info .name { font-size: 15px; font-weight: 700; }
  .app-info .sub { font-size: 11px; color: #94a3b8; margin-top: 2px; }
  .app-arrow { color: #cbd5e1; font-size: 18px; }
  .note { font-size: 11px; color: #94a3b8; text-align: center; margin-top: 20px; line-height: 1.6; }
  .footer { text-align: center; padding: 0 26px 22px; font-size: 11px; color: #cbd5e1; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="brand">QUICKPAY</div>
    <div class="amount" id="amtDisplay"><span>₹</span>0</div>
    <div class="desc">Choose app to pay · ऐप चुनें</div>
  </div>
  <div class="body">
    <div class="info-row">
      <span class="label">Payee / प्राप्तकर्ता</span>
      <span class="value">8999097063@ybl</span>
    </div>
    <div class="info-row">
      <span class="label">Amount / राशि</span>
      <span class="value" id="amtRow">₹0</span>
    </div>

    <div class="pay-title">Select payment method</div>
    <div class="app-list">
      <a class="app-item" id="phonepeBtn" href="#">
        <div class="app-icon icon-phonepe">P</div>
        <div class="app-info">
          <div class="name">PhonePe</div>
          <div class="sub">Pay with PhonePe UPI</div>
        </div>
        <div class="app-arrow">›</div>
      </a>
      <a class="app-item" id="paytmBtn" href="#">
        <div class="app-icon icon-paytm">₹</div>
        <div class="app-info">
          <div class="name">Paytm</div>
          <div class="sub">Pay with Paytm UPI</div>
        </div>
        <div class="app-arrow">›</div>
      </a>
      <a class="app-item" id="gpayBtn" href="#">
        <div class="app-icon icon-gpay">G</div>
        <div class="app-info">
          <div class="name">Google Pay</div>
          <div class="sub">Pay with Google Pay UPI</div>
        </div>
        <div class="app-arrow">›</div>
      </a>
    </div>

    <div class="note">
      Amount will be pre-filled. सिर्फ PIN डालकर भुगतान करें।
    </div>
  </div>
  <div class="footer">Secure UPI Payment</div>
</div>

<script>
const UPI_ID = "8999097063@ybl";

const urlParams = new URLSearchParams(window.location.search);
const amount = urlParams.get('am') || '0';

document.getElementById('amtDisplay').innerHTML = '<span>₹</span>' + amount;
document.getElementById('amtRow').textContent = '₹' + amount;

document.getElementById('phonepeBtn').href = `phonepe://pay?pa=${UPI_ID}&pn=QuickPay&am=${amount}&cu=INR`;
document.getElementById('paytmBtn').href = `paytmmp://pay?pa=${UPI_ID}&pn=QuickPay&am=${amount}&cu=INR`;
document.getElementById('gpayBtn').href = `tez://upi/pay?pa=${UPI_ID}&pn=QuickPay&am=${amount}&cu=INR`;
</script>
</body>
</html>
