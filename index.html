<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FollowUp</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-dark: #0a0a0f;
    --bg-card: rgba(20, 20, 30, 0.7);
    --bg-input: rgba(255, 255, 255, 0.03);
    --bg-input-hover: rgba(255, 255, 255, 0.05);
    --bg-input-focus: rgba(255, 255, 255, 0.06);
    --bg-subtle: rgba(255, 255, 255, 0.02);
    --border: rgba(255, 255, 255, 0.08);
    --border-hover: rgba(255, 255, 255, 0.15);
    --text-primary: #fff;
    --text-secondary: #a0a0b0;
    --text-muted: #6b6b7b;
    --accent-1: #833ab4;
    --accent-2: #fd1d1d;
    --accent-3: #fcb045;
    --success: #22c55e;
    --error: #ef4444;
    --card-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 80px rgba(131,58,180,0.15);
    --gradient-text: linear-gradient(135deg, #fff, #c0c0d0);
  }

  body.day-mode {
    --bg-dark: #eef0f5;
    --bg-card: rgba(255, 255, 255, 0.9);
    --bg-input: rgba(0, 0, 0, 0.04);
    --bg-input-hover: rgba(0, 0, 0, 0.06);
    --bg-input-focus: rgba(0, 0, 0, 0.07);
    --bg-subtle: rgba(0, 0, 0, 0.02);
    --border: rgba(0, 0, 0, 0.1);
    --border-hover: rgba(0, 0, 0, 0.18);
    --text-primary: #1a1a2e;
    --text-secondary: #4a4a5a;
    --text-muted: #8888a0;
    --card-shadow: 0 20px 60px rgba(0,0,0,0.1), 0 0 80px rgba(131,58,180,0.1);
    --gradient-text: linear-gradient(135deg, #1a1a2e, #4a4a5a);
  }

  html, body {
    touch-action: pan-y;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }

  body {
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    background: var(--bg-dark);
    color: var(--text-primary);
    display: flex; justify-content: center; align-items: center;
    padding: 20px; position: relative; overflow-x: hidden;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    transition: background 0.4s ease, color 0.4s ease;
  }

  body * { user-select: none; }
  input, textarea { user-select: text; }

  body::before {
    content: ''; position: fixed; top: -50%; left: -50%;
    width: 200%; height: 200%;
    background:
      radial-gradient(circle at 20% 30%, rgba(131,58,180,0.25), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(253,29,29,0.2), transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(252,176,69,0.1), transparent 50%);
    animation: bgMove 20s ease-in-out infinite;
    z-index: 0; pointer-events: none;
    transition: opacity 0.4s ease;
  }

  body.day-mode::before { opacity: 0.35; }

  @keyframes bgMove {
    0%, 100% { transform: translate(0,0) rotate(0deg); }
    50% { transform: translate(-5%,-5%) rotate(5deg); }
  }

  .container {
    position: relative; z-index: 1;
    background: var(--bg-card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px 32px;
    max-width: 440px; width: 100%;
    box-shadow: var(--card-shadow);
    animation: fadeIn 0.5s ease;
    transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .theme-toggle {
    position: absolute;
    top: 18px; right: 18px;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg-input);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--text-secondary);
    transition: all 0.3s ease;
    z-index: 10;
    -webkit-tap-highlight-color: transparent;
  }

  .theme-toggle:hover {
    background: var(--bg-input-hover);
    border-color: var(--border-hover);
    color: var(--text-primary);
    transform: scale(1.08);
  }

  .theme-toggle:active { transform: scale(0.92); }

  .theme-toggle .icon {
    width: 18px; height: 18px;
    display: block;
    transition: transform 0.4s ease;
  }

  .theme-toggle .icon-sun { display: none; }
  .theme-toggle .icon-moon { display: block; }

  body.day-mode .theme-toggle .icon-moon { display: none; }
  body.day-mode .theme-toggle .icon-sun { display: block; }

  .theme-toggle:hover .icon { transform: rotate(20deg); }

  .header { text-align: center; margin-bottom: 32px; }

  .logo-wrap {
    display: inline-flex; align-items: center; gap: 10px; margin-bottom: 8px;
  }

  .logo-icon {
    width: 42px; height: 42px; border-radius: 12px;
    background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(220,39,67,0.4);
  }

  .logo-icon svg { width: 24px; height: 24px; fill: #fff; }

  .logo {
    font-size: 24px; font-weight: 800; letter-spacing: -0.5px;
    background: var(--gradient-text);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    transition: all 0.4s ease;
  }

  .subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    transition: color 0.4s ease;
  }

  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px;
    background: rgba(34,197,94,0.1);
    border: 1px solid rgba(34,197,94,0.2);
    border-radius: 20px;
    font-size: 11px; color: var(--success);
    font-weight: 500; margin-top: 10px;
  }

  .badge::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 8px var(--success);
    animation: pulse 2s infinite;
  }

  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

  .label {
    display: block; font-size: 12px; font-weight: 600;
    color: var(--text-secondary); text-transform: uppercase;
    letter-spacing: 0.8px; margin-bottom: 10px; text-align: left;
    transition: color 0.4s ease;
  }

  .input-wrap { position: relative; margin-bottom: 14px; }

  .input-icon {
    position: absolute; left: 16px; top: 50%;
    transform: translateY(-50%);
    font-size: 16px; color: var(--text-muted);
    pointer-events: none;
    transition: color 0.4s ease;
  }

  .input-box {
    width: 100%; padding: 14px 16px 14px 44px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-family: inherit;
    color: var(--text-primary);
    outline: none;
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s, color 0.4s ease;
    font-size: 16px;
  }

  .input-box::placeholder { color: var(--text-muted); font-size: 14px; }

  .input-box:focus {
    background: var(--bg-input-focus);
    border-color: var(--accent-1);
    box-shadow: 0 0 0 4px rgba(131,58,180,0.15);
  }

  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button {
    -webkit-appearance: none; margin: 0;
  }
  input[type=number] { -moz-appearance: textfield; }

  .btn {
    width: 100%; padding: 14px; border: none;
    border-radius: 12px;
    font-family: inherit; font-size: 14px;
    font-weight: 600; cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
    position: relative; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color: #fff;
    box-shadow: 0 4px 20px rgba(131,58,180,0.3);
  }

  .btn-primary:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 8px 30px rgba(253,29,29,0.4);
  }

  .btn-primary:active:not(:disabled) { transform: scale(0.98); }

  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-cancel {
    background: rgba(239,68,68,0.1);
    color: #ef4444;
    border: 1px solid rgba(239,68,68,0.3);
    margin-top: 10px;
    display: none;
  }

  .btn-cancel:hover:not(:disabled) {
    background: rgba(239,68,68,0.18);
    border-color: rgba(239,68,68,0.5);
  }

  .btn-cancel:active:not(:disabled) { transform: scale(0.98); }

  .divider {
    display: flex; align-items: center; gap: 12px;
    margin: 26px 0 20px;
    color: var(--text-muted); font-size: 11px;
    font-weight: 600; letter-spacing: 1px;
    text-transform: uppercase;
    transition: color 0.4s ease;
  }

  .divider::before, .divider::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
    transition: background 0.4s ease;
  }

  .quick-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }

  .chip {
    padding: 7px 14px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 12px; font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s ease;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .chip:hover {
    background: rgba(131,58,180,0.15);
    border-color: var(--accent-1);
    color: var(--text-primary);
    transform: translateY(-1px);
  }

  .chip:active { transform: scale(0.95); }

  .result-box {
    display: none;
    margin-top: 22px;
    padding: 22px 20px;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: 16px;
    text-align: center;
    animation: fadeIn 0.3s ease;
    transition: background 0.4s ease, border-color 0.4s ease;
  }

  .username-display {
    font-size: 20px; font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.3px;
    transition: color 0.4s ease;
  }

  .status-msg {
    font-size: 13px; margin-top: 8px; min-height: 20px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: color 0.3s;
  }

  .loading-spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(131,58,180,0.2);
    border-top-color: var(--accent-1);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .check-mark {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--success); color: #fff;
    font-size: 11px; font-weight: bold;
    animation: checkPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes checkPop {
    0% { transform: scale(0); opacity: 0; }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); opacity: 1; }
  }

  .status-text-loading { color: var(--text-muted); }
  .status-text-success { color: var(--success); font-weight: 500; }

  .live-counter {
    display: none;
    margin-top: 18px; padding: 18px 16px;
    background: linear-gradient(135deg, rgba(131,58,180,0.12), rgba(253,29,29,0.08));
    border: 1px solid rgba(131,58,180,0.25);
    border-radius: 14px; text-align: center;
    animation: fadeIn 0.3s ease;
  }

  body.day-mode .live-counter {
    background: linear-gradient(135deg, rgba(131,58,180,0.08), rgba(253,29,29,0.05));
    border-color: rgba(131,58,180,0.2);
  }

  .counter-label {
    font-size: 11px; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 1px;
    font-weight: 600; margin-bottom: 8px;
    transition: color 0.4s ease;
  }

  .counter-number {
    font-size: 36px; font-weight: 800; letter-spacing: -1px;
    background: var(--gradient-text);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
    transition: all 0.4s ease;
  }

  .counter-target {
    font-size: 13px; color: var(--text-muted);
    margin-top: 6px;
    transition: color 0.4s ease;
  }

  .counter-target strong {
    color: var(--text-secondary); font-weight: 600;
    transition: color 0.4s ease;
  }

  .counter-number.pulse { animation: numPulse 0.4s ease; }

  @keyframes numPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  .progress {
    width: 100%; height: 4px;
    background: var(--bg-input);
    border-radius: 10px; margin-top: 16px;
    overflow: hidden; display: none;
    transition: background 0.4s ease;
  }

  .progress-bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2), var(--accent-3));
    border-radius: 10px;
    transition: width 0.3s ease;
    box-shadow: 0 0 12px rgba(253,29,29,0.6);
  }

  .add-status {
    margin-top: 14px; font-size: 13px; font-weight: 500;
    min-height: 18px; line-height: 1.6;
    transition: color 0.3s; text-align: center;
  }

  .success-box {
    display: none; margin-top: 14px; padding: 16px 18px;
    background: rgba(34,197,94,0.08);
    border: 1px solid rgba(34,197,94,0.25);
    border-radius: 14px; text-align: center;
    animation: checkPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  body.day-mode .success-box {
    background: rgba(34,197,94,0.1);
    border-color: rgba(34,197,94,0.3);
  }

  .success-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--success); color: #fff;
    font-size: 22px; font-weight: bold; margin-bottom: 10px;
    box-shadow: 0 8px 24px rgba(34,197,94,0.4);
    animation: checkPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .success-title {
    font-size: 15px; font-weight: 700;
    color: var(--success); margin-bottom: 6px;
  }

  .success-msg {
    font-size: 13px; color: var(--text-secondary);
    line-height: 1.5; transition: color 0.4s ease;
  }

  .success-msg strong {
    color: var(--text-primary); font-weight: 600;
    transition: color 0.4s ease;
  }

  .cancel-box {
    display: none; margin-top: 14px; padding: 16px 18px;
    background: rgba(239,68,68,0.08);
    border: 1px solid rgba(239,68,68,0.25);
    border-radius: 14px; text-align: center;
    animation: fadeIn 0.3s ease;
  }

  body.day-mode .cancel-box {
    background: rgba(239,68,68,0.1);
    border-color: rgba(239,68,68,0.3);
  }

  .cancel-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--error); color: #fff;
    font-size: 22px; font-weight: bold; margin-bottom: 10px;
    box-shadow: 0 8px 24px rgba(239,68,68,0.4);
  }

  .cancel-title {
    font-size: 15px; font-weight: 700;
    color: var(--error); margin-bottom: 6px;
  }

  .cancel-msg {
    font-size: 13px; color: var(--text-secondary);
    line-height: 1.5; transition: color 0.4s ease;
  }

  .cancel-msg strong {
    color: var(--text-primary); font-weight: 600;
    transition: color 0.4s ease;
  }

  .disclaimer {
    font-size: 11px; color: var(--text-muted);
    margin-top: 22px; line-height: 1.6; text-align: center;
    padding-top: 18px; border-top: 1px solid var(--border);
    transition: color 0.4s ease, border-color 0.4s ease;
  }

  .count-preview {
    font-size: 11px; color: var(--text-muted);
    text-align: right; margin-top: -6px;
    margin-bottom: 12px; min-height: 14px;
    transition: color 0.4s ease;
  }
</style>
</head>
<body>

<div class="container">
  <div class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
    <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" 
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/>
      <line x1="12" y1="1" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="12" y1="21" x2="12" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="1" y1="12" x2="3" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="21" y1="12" x2="23" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="header">
    <div class="logo-wrap">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
        </svg>
      </div>
      <div class="logo">FollowUp</div>
    </div>
    <div class="subtitle">Grow your social presence instantly</div>
    <div class="badge">Live</div>
  </div>

  <span class="label">Username</span>
  <div class="input-wrap">
    <span class="input-icon">@</span>
    <input type="text" class="input-box" id="username" placeholder="username">
  </div>
  <button class="btn btn-primary" id="searchBtn" onclick="searchProfile()">
    Search Profile
  </button>

  <div class="result-box" id="resultBox">
    <div class="username-display" id="displayUsername"></div>
    <div class="status-msg" id="statusMsg"></div>
  </div>

  <div class="divider">Add Followers</div>

  <span class="label">Number of Followers</span>
  <div class="input-wrap">
    <span class="input-icon">📈</span>
    <input type="number" class="input-box" id="followerCount"
           placeholder="Enter amount (min 50)" min="50">
  </div>
  <div class="count-preview" id="countPreview"></div>

  <div class="quick-chips">
    <div class="chip" onclick="setCount(50)">+50</div>
    <div class="chip" onclick="setCount(100)">+100</div>
    <div class="chip" onclick="setCount(500)">+500</div>
    <div class="chip" onclick="setCount(1000)">+1K</div>
    <div class="chip" onclick="setCount(5000)">+5K</div>
  </div>

  <button class="btn btn-primary" id="addBtn" onclick="addFollowers()">
    Add Followers
  </button>

  <button class="btn btn-cancel" id="cancelBtn" onclick="cancelAdding()">
    ✕ Cancel
  </button>

  <div class="live-counter" id="liveCounter">
    <div class="counter-label">Adding Followers</div>
    <div class="counter-number" id="counterNumber">0</div>
    <div class="counter-target">Target: <strong id="counterTarget">0</strong></div>
  </div>

  <div class="progress" id="progress">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="success-box" id="successBox">
    <div class="success-icon">✓</div>
    <div class="success-title">Order Placed Successfully</div>
    <div class="success-msg" id="successMsg"></div>
  </div>

  <div class="cancel-box" id="cancelBox">
    <div class="cancel-icon">✕</div>
    <div class="cancel-title">Order Cancelled</div>
    <div class="cancel-msg" id="cancelMsg"></div>
  </div>

  <div class="add-status" id="addStatus"></div>

  <div class="disclaimer">
    🔒 Secure & encrypted connection
  </div>
</div>

<script>
  let currentUsername = '';
  let countingInterval = null;
  let isCounting = false;

  const countInput = document.getElementById('followerCount');
  const countPreview = document.getElementById('countPreview');

  function toggleTheme() {
    document.body.classList.toggle('day-mode');
    const isDay = document.body.classList.contains('day-mode');
    try { localStorage.setItem('followup-theme', isDay ? 'day' : 'night'); } catch(e) {}
  }

  (function initTheme() {
    try {
      const saved = localStorage.getItem('followup-theme');
      if (saved === 'day') document.body.classList.add('day-mode');
    } catch(e) {}
  })();

  let lastTouchEnd = 0;
  document.addEventListener('touchend', function (event) {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) event.preventDefault();
    lastTouchEnd = now;
  }, false);

  document.addEventListener('wheel', function(e) {
    if (e.ctrlKey) e.preventDefault();
  }, { passive: false });

  document.addEventListener('gesturestart', function(e) {
    e.preventDefault();
  });

  countInput.addEventListener('input', () => {
    const val = parseInt(countInput.value);
    if (val && val > 0) {
      countPreview.textContent = '→ ' + val.toLocaleString('en-IN') + ' followers';
    } else {
      countPreview.textContent = '';
    }
  });

  function setCount(num) {
    countInput.value = num;
    countPreview.textContent = '→ ' + num.toLocaleString('en-IN') + ' followers';
    document.getElementById('addStatus').textContent = '';
    document.getElementById('successBox').style.display = 'none';
    document.getElementById('cancelBox').style.display = 'none';
  }

  function searchProfile() {
    const input = document.getElementById('username').value.trim().replace('@', '');
    const resultBox = document.getElementById('resultBox');
    const displayUsername = document.getElementById('displayUsername');
    const statusMsg = document.getElementById('statusMsg');
    const searchBtn = document.getElementById('searchBtn');

    if (!input) {
      alert('कृपया यूज़रनेम डालें');
      return;
    }

    currentUsername = input;
    resultBox.style.display = 'block';
    displayUsername.textContent = '@' + input;
    searchBtn.disabled = true;

    statusMsg.className = 'status-msg status-text-loading';
    statusMsg.innerHTML = '<span class="loading-spinner"></span> Searching profile...';

    setTimeout(() => {
      statusMsg.className = 'status-msg status-text-success';
      statusMsg.innerHTML = '<span class="check-mark">✓</span> Profile found';
      searchBtn.disabled = false;
    }, 1800);
  }

  function addFollowers() {
    const addBtn = document.getElementById('addBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const addStatus = document.getElementById('addStatus');
    const progress = document.getElementById('progress');
    const progressBar = document.getElementById('progressBar');
    const countVal = document.getElementById('followerCount').value;

    const liveCounter = document.getElementById('liveCounter');
    const counterNumber = document.getElementById('counterNumber');
    const counterTarget = document.getElementById('counterTarget');
    const successBox = document.getElementById('successBox');
    const cancelBox = document.getElementById('cancelBox');

    if (countingInterval) clearInterval(countingInterval);
    successBox.style.display = 'none';
    cancelBox.style.display = 'none';
    addStatus.textContent = '';

    if (!currentUsername) {
      addStatus.style.color = '#ef4444';
      addStatus.textContent = '✕ Please search a username first';
      return;
    }

    const target = parseInt(countVal);
    if (!target || target < 50) {
      addStatus.style.color = '#ef4444';
      addStatus.textContent = '✕ Minimum 50 followers required';
      return;
    }

    if (target > 100000) {
      addStatus.style.color = '#ef4444';
      addStatus.textContent = '✕ Maximum 100,000 at once';
      return;
    }

    isCounting = true;
    addBtn.disabled = true;
    addBtn.textContent = 'Adding...';
    cancelBtn.style.display = 'block';
    progress.style.display = 'block';
    progressBar.style.width = '0%';

    liveCounter.style.display = 'block';
    counterTarget.textContent = target.toLocaleString('en-IN');
    counterNumber.textContent = '0';

    let current = 0;
    const stepDelay = 3000;
    const stepIncrement = 1;

    countingInterval = setInterval(() => {
      if (!isCounting) return;

      current += stepIncrement;
      if (current > target) current = target;

      counterNumber.textContent = current.toLocaleString('en-IN');

      counterNumber.classList.remove('pulse');
      void counterNumber.offsetWidth;
      counterNumber.classList.add('pulse');

      const percent = (current / target) * 100;
      progressBar.style.width = percent + '%';

      if (current >= target) {
        clearInterval(countingInterval);
        countingInterval = null;
        isCounting = false;
        finishAdding(target, counterNumber, successBox, successMsg, addBtn, cancelBtn, progress);
      }
    }, stepDelay);
  }

  function finishAdding(target, counterNumber, successBox, successMsg, addBtn, cancelBtn, progress) {
    setTimeout(() => {
      document.getElementById('liveCounter').style.display = 'none';
      progress.style.display = 'none';

      successMsg.innerHTML = 'Your <strong>' + target.toLocaleString('en-IN') +
        ' followers</strong> will arrive within <strong>2 hours</strong>.';
      successBox.style.display = 'block';

      counterNumber.textContent = '0';
      addBtn.disabled = false;
      addBtn.textContent = 'Add Followers';
      cancelBtn.style.display = 'none';
    }, 800);
  }

  function cancelAdding() {
    if (countingInterval) {
      clearInterval(countingInterval);
      countingInterval = null;
    }
    isCounting = false;

    const addBtn = document.getElementById('addBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const progress = document.getElementById('progress');
    const liveCounter = document.getElementById('liveCounter');
    const cancelBox = document.getElementById('cancelBox');
    const cancelMsg = document.getElementById('cancelMsg');
    const successBox = document.getElementById('successBox');
    const addStatus = document.getElementById('addStatus');

    progress.style.display = 'none';
    document.getElementById('progressBar').style.width = '0%';
    liveCounter.style.display = 'none';
    successBox.style.display = 'none';
    addStatus.textContent = '';

    addBtn.disabled = false;
    addBtn.textContent = 'Add Followers';
    cancelBtn.style.display = 'none';

    cancelMsg.innerHTML =
      'Your order for <strong>@' + currentUsername + '</strong> has been cancelled.' +
      '<div style="margin-top:12px; padding-top:12px; border-top:1px solid rgba(239,68,68,0.2);">' +
      '<span style="color:#ef4444; font-weight:600; font-size:12.5px; line-height:1.6; display:block;">' +
      '⚠ <strong>WARNING:</strong> If you cancel now, your followers will NOT be delivered.<br>' +
      'You will need to place a new order from the beginning.' +
      '</span>' +
      '</div>';

    cancelBox.style.display = 'block';

    setTimeout(() => {
      cancelBox.style.display = 'none';
    }, 7000);
  }
</script>

</body>
</html>
